<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my custom element</title>
</head>
<body>
    <my-element>
        <span slot="title">Titulo 3</span>
        <span slot="parrafo">Parrafo 3</span>
    </my-element>
    <my-element class="blue">
        <span slot="title">Titulo 4</span>
        <span slot="parrafo">Parrafo 4</span>
    </my-element>
    <my-element class="card">
        <span slot="title">Titulo 5</span>
        <span slot="parrafo">Parrafo 5</span>
    </my-element>
    <script type="module" src="my-element.js"></script>
</body>
</html>
