<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Properties</title>
    <style>
        my-element{
            --color: yellow;
            --heading: 20px;
        }
        my-element.text{
            --color: grey;
            --heading: 50px;
        }
    </style>
</head>
<body>
    <my-element>
        <span class="text" slot="title">Titulo 6</span>
        <span slot="parrafo">Parrafo 6</span>
    </my-element>
    <my-element>
        <span slot="title">Titulo 7</span>
        <span slot="parrafo">Parrafo 7</span>
    </my-element>
    <my-element>
        <span slot="title">Titulo 8</span>
        <span slot="parrafo">Parrafo 8</span>
    </my-element>
    <script type="module" src="my-element.js"></script>
</body>
</html>
