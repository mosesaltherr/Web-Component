<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow DOM</title>
    <style>
        .title { color: blue; }
    </style>
</head>
<body>
    <h2 class="title">Hello World 2</h2>
    <my-element>
        <template>
            <h2>
                <div>soy yo</div>
            </h2>
        </template>
    </my-element>
    <script type="module" src="my-element.js"></script>
</body>
</html>
